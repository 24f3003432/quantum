<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EchoTrace Telemetry{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="nav-header">
        <div class="nav-container">
            <div class="nav-left">
                <span class="brand-logo">ECHOTRACE</span>
                <div class="live-indicator">
                    <span class="live-pulse"></span>
                    <span class="live-text">Monitoring Live</span>
                </div>
            </div>

            <nav class="nav-center">
                <a href="{{ url_for('index') }}" class="nav-link {% if request.path == '/' %}active{% endif %}">Overview</a>
                <a href="{{ url_for('api_inspector') }}" class="nav-link {% if request.path == '/api-inspector' %}active{% endif %}">SchemaMedic</a>
                <a href="{{ url_for('timeline') }}" class="nav-link {% if request.path == '/incident-timeline' %}active{% endif %}">EchoTrace</a>
            </nav>

            <div class="nav-right">
                <span class="env-badge">Production v2.4</span>
            </div>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-container">
            <span>&copy; 2026 EchoTrace Telemetry &bull; Vercel-grade Performance System</span>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
